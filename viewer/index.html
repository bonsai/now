<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>now — Observation Viewer</title>
<style>
:root{font-family:system-ui,sans-serif;color:#171717;background:#f6f6f3}
body{margin:0}main{max-width:1100px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:32px}small{color:#666}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
section{background:white;border:1px solid #ddd;border-radius:12px;padding:16px}
h2{font-size:18px;margin:0 0 12px}
.card{border-top:1px solid #eee;padding:12px 0}
.card:first-child{border-top:0}
.meta{font-size:12px;color:#777}
.badge{display:inline-block;border:1px solid #ccc;border-radius:999px;padding:2px 8px;font-size:12px;margin-right:4px}
.error{border-left:4px solid #c33;padding-left:10px}
input{max-width:100%}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>now</h1><small>Observation Data Viewer</small></div>
  <label><small>JSONL</small><br><input id="file" type="file" accept=".jsonl,.ndjson,.json"></label>
</header>
<div class="grid">
<section><h2>Issues</h2><div id="issues"><small>Observation JSONLを読み込んでください。</small></div></section>
<section><h2>WF Errors</h2><div id="errors"><small>Observation JSONLを読み込んでください。</small></div></section>
</div>
</main>
<script>
const file = document.querySelector('#file');
file.addEventListener('change', async () => {
  const text = await file.files[0].text();
  const rows = text.split(/\r?\n/).filter(Boolean).map(JSON.parse);
  render(rows);
});
function render(rows){
  const issues = rows.filter(r => r.subject?.type === 'issue');
  const errors = rows.filter(r => r.subject?.type === 'workflow-error' || r.data?.conclusion === 'failure');
  document.querySelector('#issues').innerHTML = issues.length ? issues.map(issueCard).join('') : '<small>Issue observations: 0</small>';
  document.querySelector('#errors').innerHTML = errors.length ? errors.map(errorCard).join('') : '<small>WF errors: 0</small>';
}
function issueCard(r){
  const d=r.data||{};
  return '<article class="card"><strong>'+esc(r.subject?.label||r.subject?.id)+'</strong><div class="meta">'+esc(r.observedAt||'')+'</div><div>'+badge(d.state||'unknown')+badge(d.labels||'')+'</div></article>';
}
function errorCard(r){
  const d=r.data||{};
  return '<article class="card error"><strong>'+esc(r.subject?.label||d.workflow||r.subject?.id)+'</strong><div class="meta">'+esc(r.observedAt||'')+'</div><div>'+esc(d.message||d.step||d.job||'failure')+'</div></article>';
}
function badge(v){return '<span class="badge">'+esc(Array.isArray(v)?v.join(', '):String(v))+'</span>'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body>
</html>
